code: "1.1.3.7"
guid: 349937E3-A2FD-41F8-B7C4-BD6FA106ADD4
name: Flood
description: Use this domain for words related to floods.
related: ["1.1.3.3", "1.3.1.3"]
questions:
  - q: What words refer to a time when there is too much rain?
    words: heavy rains, experience torrential rains, el Niño
  - q: What words refer to when the ground is covered by water?
    words: flood (n), flood (v), flooding, inundate, deluge
  - q: What words refer to a flood ending?
    words: recede
  - q: What words refer to an area that is often flooded by a river?
    words: floodplain
  - q: What words refer to the material left behind by a flood?
    words: silt
