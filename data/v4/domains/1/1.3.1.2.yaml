code: "1.3.1.2"
guid: 31777669-E37B-4B77-9CCE-0D8C33F6EBB9
name: Swamp
description: >-
  Use this domain for words referring to bodies of standing water with plants growing in
  them.
questions:
  - q: What words refer to shallow bodies of standing water with plants growing in them?
    words: swamp, swampland, wetland, marsh, marshland, bog, delta, estuary, bayou, morass
  - q: What words describe an area that is a swamp?
    words: swampy, marshy, boggy
  - q: What words refer to moving through a swamp?
    words: get bogged down, sink
