code: "1.3.2.5"
guid: B09205D4-FBB4-4BCD-94EF-F8D83E298462
name: Calm, rough
description: Use this domain for words describing the surface of water.
questions:
  - q: What words describe the surface of the water when it is calm?
    words: calm, becalmed, quiet, peaceful, tranquil, hardly a ripple, glassy, still, stagnant
  - q: What words describe the surface of the water when it is rough?
    words: rough (seas), storm-tossed (sea), raging (sea), seethe, choppy
  - q: What words describe the flow of a river when it is slow?
    words: slow moving, sluggish, smooth stretch, gentle stretch
  - q: What words describe the flow of a river when it is fast?
    words: fast-flowing, white-water (rapids), raging rapids, rough water
  - q: What words refer to making water rough?
    words: agitate, churn, stir, whip
