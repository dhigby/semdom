name: Primate
description: Use this domain for primates (phylum Chordata, class Mammalia, order Primates).
questions:
  - q: What general words refer to primates?
    words: primate, ape, monkey, anthropoid
  - q: What species of primates are there?
    words: >-
      baboon, capuchin, chimpanzee, colobus, gibbon, gorilla, langur, lemur, orangutan,
      macaque, mandrill, marmoset, rhesus, ringtail
