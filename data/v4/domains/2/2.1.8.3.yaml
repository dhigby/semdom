name: Male organs
description: Use this domain for words related to the male reproductive organs.
questions:
  - q: What general words refer to the reproductive organs?
    words: reproductive organs, sexual organs, genitals, gonad, pubes, privates
  - q: What words refer to the male organs?
    words: penis, scrotum, testicle, testis, foreskin, loins
  - q: What do the male organs do?
    words: swell, enlarge, erect, erection, ejaculate, ejaculation
  - q: What words refer to the liquid produced?
    words: semen, sperm, seminal
  - q: What words describe something to do with the male organs?
    words: reproductive, genital, sexual
