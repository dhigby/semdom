name: Fetus
description: Use this domain for words related to a fetus--a baby that has not been born yet.
questions:
  - q: What words refer to an unborn baby?
    words: unborn child, unborn baby, fetus, embryo
  - q: >-
      What words refer to the parts that surround a baby and connect it to its mother's
      womb?
    words: umbilical cord, placenta, placental, sack, fluid, afterbirth
