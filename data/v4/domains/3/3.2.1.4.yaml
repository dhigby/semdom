      stupid, thick, thickheaded, undiscerning, unimaginative, unperceptive, unsound,
      witless, lacking in intelligence, mentally lazy
  - q: What words describe someone who makes bad decisions?
    words: foolish, shortsighted, unwise
  - q: 'What words refer to not being able to think well? '
    words: derangement, idiocy, imbecility, insanity, lunacy, madness, senility, stupidity
