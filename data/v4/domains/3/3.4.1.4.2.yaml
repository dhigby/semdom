code: "3.4.1.4.2"
guid: 85912845-21B0-41EB-8B8C-1F5C3D53DF08
name: Enthusiastic
description: >-
  Use this domain for words related to feeling enthusiastic--to feel very good because you
  want to do something or you want something to happen.
louwNidaCodes: 25F Be Eager, Be Earnest, In a Devoted Manner
questions:
  - q: What words refer to feeling enthusiastic?
    words: be into something, be excited about, be raring to go, eagerly
  - q: What words refer to the feeling of enthusiasm?
    words: enthusiasm, eagerness, zeal
  - q: What words describe someone who feels enthusiastic?
    words: >-
      enthusiastic, enthused, animated, ardent, avid, eager, fervent, hot, motivated,
      zealous, have purpose, keen, mad about
  - q: What words refer to feeling very enthusiastic?
    words: get carried away, be full of enthusiasm
  - q: What words refer to causing someone to feel enthusiastic?
    words: inspire, motivate, fire up, enthuse
  - q: What words refer to something that causes someone to feel enthusiastic?
    words: motivation, motivator
  - q: What words describe something that causes someone to feel enthusiastic?
    words: motivating
  - q: What words refer to someone who is enthusiastic about something?
    words: fan
  - q: What words refer to not feeling enthusiastic?
    words: >-
      not enthusiastic, unenthusiastic, lack of enthusiasm, half-hearted, lukewarm, muted,
      your heart's not in it
