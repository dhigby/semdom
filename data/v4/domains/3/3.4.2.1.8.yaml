code: "3.4.2.1.8"
guid: 262FC4AE-7735-465B-934B-2125D95DE147
name: Jealous
description: >-
  Use this domain for words related to feeling jealous--to feel bad when someone does well,
  has something good, receives something good, or something good happens to them, because
  you want what they have. Also use this domain for words for when a husband (or wife) is
  jealous because he thinks his wife loves someone else.
louwNidaCodes: 88V Envy, Jealousy
questions:
  - q: What words refer to feeling envious?
    words: be jealous, feel jealous, jealously, envy (v), begrudge, turn green, covet
  - q: What words refer to the feeling of jealousy?
    words: jealousy, envy (n), covetousness, resentment, sour grapes
  - q: What words describe someone who feels jealous?
    words: jealous, possessive, envious, green with envy, covetous, jaundiced, resentful, bitter
  - q: What words refer to feeling very jealous?
    words: bitterly jealous
  - q: What words refer to causing someone to feel jealous?
    words: make someone jealous, arouse jealousy
  - q: What words refer to not feeling jealous?
    words: not begrudge
