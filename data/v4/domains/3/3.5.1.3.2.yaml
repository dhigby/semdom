name: Tell a lie
description: Use this domain for words related to lying--to say something that is not true.
questions:
  - q: What words refer to saying something that is not true?
    words: lie, tell a lie, pervert truth, deceive, tell tales, perjure, make up
  - q: What words refer to a lie?
    words: lie, falsehood, fib, white lie, half-truth, perjury, propaganda
  - q: What words refer to someone who lies?
    words: liar
