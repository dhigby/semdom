name: Real
description: Use this domain for words that indicate if something is real.
louwNidaCodes: 70 Real, Unreal; 73 Genuine, Phony
questions:
  - q: What words describe something that is real?
    words: real, actual, genuine
  - q: What words describe something that is real and not imagined?
    words: actual, concrete, fact, factual, nonfiction, real, reality, true
  - q: What words describe something that is not real?
    words: unreal, artificial, imaginary, phony, pretend
