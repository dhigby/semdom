questions:
  - q: What words refer to a child who is born to an unmarried woman?
    words: illegitimate child, bastard
  - q: What words refer to a woman having a child when she is not married?
    words: have a child out of wedlock
  - q: What words refer to being a child without a father?
    words: be illegitimate, fatherless
  - q: What words refer to a married woman having a child by another man?
    words: (no words in English)
