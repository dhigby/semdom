guid: E6CF2C28-7630-41D7-835D-BD171AB67378
name: Altruistic, selfless
description: >-
  Use this domain for words describing a person who acts in an altruistic, selfless
  manner--to act out of concern for the welfare of others without concern for your own
  welfare.
questions:
  - q: What words describe someone who is selfless?
    words: >-
      altruistic, selfless, unselfish, thinks of others, self-sacrificing, benevolent, Good
      Samaritan
