code: "4.3.4.6.1"
guid: 57C9A370-0F46-4475-98FD-C7A8B3F5074C
name: Spoil
description: >-
  Use this domain for words referring to spoiling something that is happening, such as an
  event, work, relationship, or feeling, by doing something that makes it less attractive,
  less enjoyable, or less effective--to do something bad to something that is happening, so
  that people can't do what they were doing or don't enjoy it as much.
related: ["8.3.7.8"]
questions:
  - q: What words refer to spoiling the quality of something?
    words: spoil, impair, mar, detract from
  - q: What words refer to spoiling someone's work?
    words: spoil, mess up, undermine, sabotage, throw a wrench in the works, pour cold water on
  - q: What words refer to spoiling a relationship?
    words: spoil, sour, poison
  - q: What words refer to spoiling an event?
    words: spoil, mar, put a damper on, cast a shadow over
  - q: What words refer to spoiling a person's reputation?
    words: spoil, damage, damaging, discredit, harm, tarnish, be tainted
  - q: What words refer to completely spoiling something?
    words: ruin, destroy, wreck, screw up, spoil everything
  - q: What words refer to someone who spoils people's enjoyment of an event?
    words: wet blanket, spoilsport, killjoy
  - q: What words describe something that has not been spoiled?
    words: unspoiled, unblemished
