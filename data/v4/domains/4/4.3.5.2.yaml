code: "4.3.5.2"
guid: EEA7C79B-6150-4ABA-8105-A94B7E6AEAB7
name: Faithful
description: >-
  Use this domain for words related to being faithful--to continue to love and do good to
  someone so that they can always trust you.
questions:
  - q: What words describe someone who is faithful?
    words: faithful, loyal, devoted, staunch, true, unswerving
  - q: What words refer to being faithful?
    words: stand by, stick by, be true to
  - q: What words refer to the quality of being faithful?
    words: faithfulness, allegiance, devotion, fidelity, loyalty, solidarity
