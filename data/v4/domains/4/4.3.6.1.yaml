code: "4.3.6.1"
guid: 3E546C11-BCB6-4024-B2F3-C15BE40E257F
name: Lack self-control
description: Use this domain for words related to a lack of self-control.
louwNidaCodes: 88K Self-Control, Lack of Self-Control; 88G' Extravagant Living, Intemperate Living
questions:
  - q: What words describe a person who does not control himself?
    words: >-
      addicted, excessive, gluttonous, indulgent, intemperate, piggish, prodigal, riotous,
      self-indulgent, surfeit, unbridled, uncontrolled, unrestrained, voracious
  - q: What words refer to a person who does not control himself?
    words: addict, Epicurean, glutton, pig, prodigal
  - q: What words refer to a lack of self-control?
    words: >-
      lack self-control, indulge, overdo, permit, do something to excess, lose control, get
      carried away, break down, give in to
  - q: What words refer to the quality of lacking self-control?
    words: >-
      addiction, debauchery, dissipation, excess, excitability, extravagance, gluttony,
      indulgence, intemperance, leniency, overindulgence
