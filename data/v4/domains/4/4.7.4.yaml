    words: courtroom, judge's chambers, jury room
  - q: What are the parts of a courtroom?
    words: jury bench, witness stand, witness box, judge's bench, lawyers table, bar, dock
  - q: What words refer to the time when the court is in session?
    words: session, the court is now in session
  - q: What is a court case called?
    words: trial, case, lawsuit, suit, action, litigation, proceedings, dispute, hearing
