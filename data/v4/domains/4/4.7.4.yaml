questions:
  - q: What is a court of law called?
    words: >-
      court of law, law court, supreme court, superior court, court of appeals, district
      court, divorce court, juvenile court, appellate court, tribunal, court-martial,
      kangaroo court
  - q: Where is a court held?
    words: courthouse
