name: Condemn, find guilty
description: Use this domain for words related to condemning someone.
questions:
  - q: What words are used of the action of condemning a person?
    words: recover damages, render a guilty verdict, hand down a conviction
  - q: What words refer to the judgment?
    words: judgment, verdict, sentence, conviction, condemnation
  - q: What words refer to the person who is condemned?
    words: condemned man, convict, guilty party
  - q: What words refer to his guilt?
    words: guilt
