name: Pardon, release
description: >-
  Use this domain for words related to pardoning someone who has been found guilty of a
  crime.
questions:
  - q: What words are used of not punishing someone who has been found guilty?
    words: >-
      pardon, grant a pardon, have mercy on, release, commute sentence, reduce sentence, let
      out, let off
