name: Fort
description: Use this domain for words related to a fort.
questions:
  - q: What words refer to a fort?
    words: fort, fortress, base, castle, bunker, post
  - q: What words refer to a place that is made into a fort for a short time?
    words: fortification, fortified position, prepared position, camp
  - q: What words refer to a hole dug in the ground to protect soldiers?
    words: foxhole, trench
  - q: What words refer to the parts of a fort?
    words: tower, barracks, dungeon, keep, moat, gatehouse, turret, blockhouse
  - q: What words refer to a wall around a fort?
    words: wall, palisade, rampart
  - q: What words refer to things place around a fort to keep enemies away?
    words: barbed wire, obstacles, mine
  - q: What words refer to making a fort?
    words: fortify, entrench, strengthen, dig in
