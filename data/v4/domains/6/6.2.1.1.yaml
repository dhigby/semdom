name: Growing grain
description: >-
  Use this domain for general words related to growing grain crops such as barley, maize
  (corn), millet, oats, rice, rye, sesame, sorghum, and wheat. If one crop is cultivated
  extensively and there are many words related to it, set up a separate domain for it. This
  has already been done for rice, wheat, and maize, since they are so common around the
  world.
