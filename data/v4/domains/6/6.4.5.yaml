name: Fishing
description: Use this domain for words related to catching fish.
ocmCodes: 226 Fishing; 225 Marine Hunting
questions:
  - q: What words refer to catching fish?
    words: to fish, to catch (fish), a catch (of fish), fishing boat
  - q: What methods are used to catch fish?
    words: net, hook, angle, trap, spear, arrow, harpoon, poison, dynamite, trawling, fishpond
  - q: What do people do to fish?
    words: catch, scale, gut, clean, smoke, dry, smoked fish, dried fish
