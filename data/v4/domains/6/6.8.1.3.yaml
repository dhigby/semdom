code: "6.8.1.3"
guid: 45993C48-3893-4D9E-96A3-B6B1AD160538
name: Poor
description: Use this domain for words related to being poor.
ocmCodes: 735 Poverty
louwNidaCodes: 57F Be Poor, Be Needy, Poverty; 57S Be a Financial Burden
questions:
  - q: What words refer to being poor?
    words: be poor, be below the poverty line, hardship case
  - q: What words describe someone who is poor?
    words: >-
      poor (person, man), destitute (person), needy, bankrupt, broke, needy,
      underprivileged, impoverished
  - q: What words are used for very bad poverty?
    words: destitute, abject poverty, owns nothing but the clothes on his back
  - q: What words refer to the condition of being poor?
    words: poverty
  - q: What is a poor person called?
    words: poor person, tramp, bum, hobo, beggar, homeless person
  - q: What are poor people called?
    words: the poor, the homeless, the destitute
