name: Smuggle
description: >-
  Use this domain for words related to smuggling--taking something secretly into a country,
  something which is illegal or without paying duty.
questions:
  - q: What words refer to smuggling?
    words: smuggle, smuggling
  - q: What words refer to someone who smuggles?
    words: smuggler
