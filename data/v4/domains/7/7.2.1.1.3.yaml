code: "7.2.1.1.3"
guid: 5ABD1270-261A-4980-93E5-E10EACEA99AD
name: Jump
description: >-
  Use this domain for words referring to jumping--moving your body off the ground by pushing
  hard with your legs.
louwNidaCodes: 15E' Jump, Leap x
questions:
  - q: What words refer to jumping up and down in one place?
    words: jump, jump up and down, bounce, leap, buck, bob, jump for joy
  - q: What words refer to jumping from one place to another place?
    words: >-
      jump up/down/off of/onto/out of the way, bound, spring, pounce, dive, jump overboard,
      somersault
  - q: What words refer to jumping over something?
    words: jump over, leap over, vault over, hurdle, clear, leapfrog
  - q: What words refer to jumping on one leg?
    words: hop, hop on one leg, hop around, skip
  - q: What games involve jumping?
    words: >-
      hopscotch, leap frog, gymnastics, high jump, broad jump, pole vault, bungee jumping,
      sky diving, parachuting
  - q: What things are used to help people jump?
    words: skipping rope, trampoline, pogo stick, springboard, parachute
