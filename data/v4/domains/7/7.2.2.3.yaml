code: "7.2.2.3"
guid: F4B18E9C-B465-4763-BA79-D7EED2CEBCFA
name: Move sideways
description: >-
  Use this domain for words referring to moving in a sideways direction--the person is
  facing one direction, but moving toward their side.
questions:
  - q: What words refer to moving sideways?
    words: >-
      move sideways, make room for, move aside, move out of the way, get out of the way,
      move over, budge, shift
