name: Not moving
description: Use this domain for words referring to not moving.
questions:
  - q: What words describe something that is not moving?
    words: stationary, still, motionless, still
  - q: What words describe something that cannot be moved?
    words: immovable, fixed, fast, set, permanent
  - q: What words describe something that is difficult to move?
    words: stable
