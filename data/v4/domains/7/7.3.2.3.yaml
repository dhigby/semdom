code: "7.3.2.3"
guid: D975A233-1E48-4313-8BED-AADA7460487E
name: Put aside
description: Use this domain for words referring to putting something to the side of you.
questions:
  - q: What words refer to putting something to the side of you?
    words: >-
      put aside, put to the side, put beside, put next to you, push aside, push to the side,
      move aside, move to the side
