name: Transport
description: Use this domain for words referring to moving something in a vehicle.
questions:
  - q: What words refer to moving something in a vehicle?
    words: >-
      transport, transportation, carry, cart, convey, drive, ferry, fly, haul, row, truck,
      trundle, wheel
