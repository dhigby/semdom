code: "7.5.4.2"
guid: 5F791DAF-98A2-4787-93CC-8813AEA93C4D
name: Tangle
description: >-
  Use this domain for words related to becoming tangled--when something long and thin, such
  as rope, string, thread, hair, grass, or vines, becomes disorganized, twisted, or knotted,
  so that it is hard to separate it.
questions:
  - q: What words refer to things becoming tangled?
    words: tangle, entangle, become tangled, get all tangled up, snarl
  - q: What words described something that is tangled?
    words: tangled, matted, raveled, snarled, all mixed up
  - q: What words refer to untangling something?
    words: untangle, unravel, comb out, straighten out
  - q: What words refer to something that has become tangled?
    words: tangle (n), tangled mess, jumble, mix-up, rat's nest, snarl
