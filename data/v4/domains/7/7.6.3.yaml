name: Lose, misplace
description: >-
  Use this domain for words referring to putting something in a place and not being able to
  find it again, or for when someone else moves something without your knowledge so that you
  cannot find it.
questions:
  - q: What words refer to losing something?
    words: lose, loss, misplace
