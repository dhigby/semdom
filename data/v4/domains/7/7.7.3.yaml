code: "7.7.3"
guid: BE4A63E7-F4BA-4DE2-BE69-D26219D99CB6
name: Kick
description: >-
  Use this domain for words referring to kicking--to hit something with your foot. The words
  in this domain may be distinguished by the way in which the foot moves, either in a
  swinging motion, or by first bending the leg and then quickly straightening it. They may
  also be distinguished by whether the foot moves horizontally or vertically, whether the
  effect is to move something or damage it, or how hard the person kicks.
questions:
  - q: What words refer to kicking something?
    words: >-
      kick, give something a kick, kick in (a door), boot, punt, stamp, stomp on, stub your
      toe on something
