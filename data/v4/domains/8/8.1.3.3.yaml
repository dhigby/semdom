code: "8.1.3.3"
guid: D8EA1902-5FA6-4FDA-B7B2-1F9C301CDC5F
name: Group of things
description: Use this domain for words that refer to a group of things.
related: ["4.2.1.7"]
questions:
  - q: What words refer to a group of things?
    words: >-
      group, collection, lot, cluster, clump, assortment, accumulation, aggregate,
      bits-and-pieces, nuts-and-bolts, odds-and-ends, stockpile, system, volley, wares
  - q: What words refer to a group of things that belong together?
    words: set, batch, suit
  - q: What words refer to a group of things that are tied or joined together?
    words: bundle, bunch, sheaf, pack, package, packet, string of
  - q: What words refer to a group of things that are put on top of each other?
    words: pile, stack, heap
  - q: What words refer to a group of things that are moved together?
    words: cargo, contents, freight, goods, lading, load
  - q: What words indicate that something is a member of a group?
    words: member, one of, part of, belong to, go with
