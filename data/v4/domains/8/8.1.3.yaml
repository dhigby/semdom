code: "8.1.3"
guid: 0EBF9FCC-EE38-4F5F-AB5E-C76E199EF7AE
name: Plural
description: >-
  Use this domain for words and affixes that indicate that there is more than one of
  something. Some languages, such as Indo-European languages, indicate plural with an affix.
  Other languages, such as Austronesian languages, use a separate word. Some languages also
  have words or affixes that indicate that there are two of something.
questions:
  - q: What words indicate that there is more than one of something?
    words: '-s'
  - q: What words indicate that there are two of something?
    words: pair of
