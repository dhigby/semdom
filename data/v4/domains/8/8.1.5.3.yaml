name: Both
description: Use this domain for words referring to both of two things.
questions:
  - q: What words refer to both of two things?
    words: both, the two of, the pair of, each, mutual, share, either, neither
    sentence: >-
      I couldn't decide which of the two I wanted more, so I bought them both.; The plan
      would be to our <mutual> benefit.; We have a <mutual> friend.; They <share> the same
      name.
