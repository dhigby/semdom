code: "8.2.2"
guid: 7648040B-0AA5-4D9A-8F13-FFD066B81602
name: Long
description: >-
  Use this domain for words related to being long. In many languages there is more than one
  system of measuring length. These systems may be used for different purposes or in
  different jobs. For instance measuring the length of an object may use different words
  than measuring the distance a person travels.
louwNidaCodes: 81C Long, Short, Far; 81F Specific Measures of Length
related: ["8.2.6", "8.2.6.1"]
questions:
  - q: What words describe something that is long?
    words: long, lengthy, extensive
  - q: What words describe a long distance?
    words: long, huge, vast
  - q: What words refer to something that is long?
    words: a length of
  - q: What words refer to something becoming long?
    words: get longer, lengthen, stretch
  - q: What words refer to making something long?
    words: make something longer, lengthen, extend, stretch
  - q: What words describe something that has been made long?
    words: lengthened, elongated, extended, stretched, outstretched
  - q: What words refer to being longer than another thing?
    words: longer, longest
  - q: What words refer to how long something is?
    words: length, distance, how long, span
  - q: What words indicate how long something is?
    words: is, measure (v), long, in length, how long, be (two inches) (too) long
  - q: What words refer to measuring how long something is?
    words: measure, pace off, step off
  - q: What words refer to a unit of length?
    words: >-
      inch, foot, yard, mile, light year, millimeter, centimeter, meter, kilometer, day's
      journey
  - q: What instruments are used to measure the length of something?
    words: >-
      caliper, chain, line, micrometer, rod, rule, ruler, tape measure, measuring tape,
      tapeline, yardstick
  - q: What words describe a system of lengths?
    words: metric
