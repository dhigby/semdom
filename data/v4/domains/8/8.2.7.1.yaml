name: Tight
description: Use this domain for words referring to being tight--when something is too small.
questions:
  - q: What words describe something that is tight?
    words: tight, too small
  - q: What words refer to something becoming tight?
    words: get tight
  - q: What words refer to making something tight?
    words: tighten
