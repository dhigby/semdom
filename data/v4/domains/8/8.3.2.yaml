code: "8.3.2"
guid: 2621E605-3ECC-4F3D-B28C-F8C92B3C4584
name: Texture
description: >-
  Use this domain for general words referring to the texture of something--how the surface
  of something feels when you touch it.
related: ["8.3.6.2", "8.3.6.5", "7.2.1.5.1", "7.5.2.2"]
questions:
  - q: What words refer to how something feels?
    words: texture, surface, (to have a) feel, (it) feels (rough), quality, grain, prickly
  - q: What words refer to giving something a certain texture?
    words: texture (v)
