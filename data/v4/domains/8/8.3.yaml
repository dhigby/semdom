name: Quality
description: Use this domain for general words referring to the quality or condition of something.
louwNidaCodes: 79 Features of Objects
questions:
  - q: What general words refer to the quality or condition of something?
    words: quality, condition, state, character, nature, feature
  - q: What words indicate that something has more of a quality than another thing?
    words: more, surpass
  - q: What words indicate that something has less of a quality than another thing?
    words: less, not as, not so
