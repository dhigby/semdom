code: "8.4.1.3.1"
guid: DE544EBD-9F94-4831-8887-944C3BBBC254
name: Days of the week
description: Use this domain for words referring to the days of the week.
questions:
  - q: What are the names of the days of the week?
    words: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday
  - q: What other terms are used for the days of the week?
    words: >-
      first day of the week (Sunday), second day of the week (Monday), midweek (Wednesday),
      Sabbath (Saturday), the Lord's day (Sunday)
  - q: What words are used to refer to all the days of the week together?
    words: days of the week
