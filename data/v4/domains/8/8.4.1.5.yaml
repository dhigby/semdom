code: "8.4.1.5"
guid: 0622D3F7-1AB2-482B-9F9C-9C101CD35182
name: Season
description: >-
  Use this domain for words referring to seasons of the year that are related to the time of
  year, the weather, or times of cultivation.
questions:
  - q: What general words refer to a season of the year?
    words: season
  - q: What words refer to a season related to the time of year?
    words: >-
      winter, spring, summer, autumn, fall, holiday season, Christmas season, new year,
      midsummer, midyear
  - q: What words are used for a part of a school year?
    words: term, semester, trimester, quarter, midterm
  - q: What words refer to a season related to the weather?
    words: season, rainy season, long rains, short rains, dry season, cold season, hot season
  - q: What words refer to a season related to a time of cultivation?
    words: planting season, growing season, harvest season, hunger season
