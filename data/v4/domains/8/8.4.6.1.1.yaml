code: "8.4.6.1.1"
guid: 5261497B-6BEB-4DB1-9DE2-10B5F6F8EC69
name: Beginning
description: >-
  Use this domain for words referring to something beginning to happen, to beginning to do
  something, to cause something to start happening, or to cause people to start doing
  something.
related: ["9.1.2.3"]
questions:
  - q: What words are used to indicate that something has begun?
    words: begin, start, commence, initiate, to institute
  - q: What words refer to the time when something begins?
    words: beginning, the start, commencement, inception, at first, initially, originally
  - q: What do people say when they want someone else to start?
    words: >-
      go, dig in, have at it, let's go, let's do it, move it, let's get going, "on your
      marks, get set, go", "ready, set, go"
  - q: What is a person called who starts something?
    words: initiator, founder, originator, starter
  - q: What words indicate that some state has begun?
    words: achieve, appear, arrive, attain
