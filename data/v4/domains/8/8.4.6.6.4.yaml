code: "8.4.6.6.4"
guid: 03D65D0C-AAFB-40C0-9CD2-3E5CED66AD03
name: All the time
description: Use this domain for words referring to something happening all the time.
questions:
  - q: What words indicate that something happens or a situation exists all the time?
    words: all the time, always, constantly, permanently, permanent
  - q: What words indicate that a situation exists during a time period?
    words: throughout, all through, the whole time, all day, all week, from start to finish
