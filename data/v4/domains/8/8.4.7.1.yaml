code: "8.4.7.1"
guid: 0D7409AB-FC1F-4680-B040-D91D7004084F
name: Interrupt
description: >-
  Use this domain for words referring to interrupting someone--speaking when someone is
  speaking, or doing something to stop someone from doing what they are doing.
questions:
  - q: What words refer to interrupting someone or something that is happening?
    words: interrupt, break in, stop, butt in, interruption, intermission, interlude
  - q: What words are used to describe something that is not interrupted?
    words: incessant, uninterrupted
