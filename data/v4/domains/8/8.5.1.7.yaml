code: "8.5.1.7"
guid: 2C143278-3EA0-49C6-9E50-E0BF7C8CF4E2
name: Indefinite location
description: Use this domain for words indicating that something is at an indefinite location.
questions:
  - q: What words refer to an indefinite location?
    words: >-
      somewhere, anywhere, someplace, anyplace, where, here, there, over there, any old
      place, wherever, who knows where, could be anywhere, undisclosed location, location
      unknown, here and there, whereabouts, hereabouts, thereabouts
