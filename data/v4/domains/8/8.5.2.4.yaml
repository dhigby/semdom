name: Up
description: Use this domain for words referring to the direction up.
questions:
  - q: What words refer to the direction up?
    words: up, upwards, upward, uphill, upstairs, higher and higher, up and down
  - q: What words describe something that is facing or pointing upwards?
    words: face-up
  - q: What words indicate that a path or road goes upward?
    words: go up, climb, rise
