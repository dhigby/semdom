name: Away from
description: Use this domain for words indicating a direction away from something.
questions:
  - q: What words indicate that something is moving away from something else?
    words: toward, towards, away from, inward, inwards, outward, outwards
  - q: What words indicate that something moves from one place (to another place)?
    words: from
