code: "8.5.3.1"
guid: 8AFFE94D-A396-4404-A0D7-C65046E617E6
name: Absent
description: >-
  Use this domain for words related to being absent--to not be in a particular place, or not
  be in the correct or expected place.
related: ["8.1.8.1", "7.2.3.3"]
questions:
  - q: What words indicate that something or someone is not in a particular place?
    words: >-
      be absent, not be here, not be around, be out, not be in, be away, missing, be off,
      not be at, not be there, absence, be gone, not present, be away, nowhere to be found,
      out of sight, truant, absent without leave, AWOL, missing in action, not show up, make
      yourself scarce, minus someone, be lacking, lose, elsewhere, somewhere else
  - q: What words refer to a person who is absent?
    words: absentee, truant, missing person, no-show
