name: Design
description: >-
  Use this domain for words referring to designing something--to decide and plan how
  something new will look and work.
questions:
  - q: What words refer to designing something?
    words: design, plan
  - q: What words refer to the way something is designed?
    words: design
  - q: What words refer to someone who designs things?
    words: designer, architect, planners
