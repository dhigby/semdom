name: Part of speech
description: >-
  This domain is for organization purposes and should not be used for any words. Use the
  domains in this section for words that belong to a particular part of speech. It is best
  not to use these domains, since they are based on grammar and not meaning. But if you have
  a small group of words that belong to a part of speech and you want to list them all, you
  can use these domains. You can also classify words in this section if you don't know what
  they mean yet.
