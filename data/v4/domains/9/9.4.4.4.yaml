code: "9.4.4.4"
guid: 85C5B8F7-8086-493D-B70D-A361BFA56F09
name: Possible
description: >-
  Use this domain for words that a speaker uses to indicate that he thinks something is
  possible. Maybe implies that the speaker doesn't know something.
louwNidaCodes: 71A Possible, Impossible
related: ["6.1.3.1", "6.1.3"]
questions:
  - q: What words indicate that something is possible?
    words: possible, possibly, could, might, may, able, maybe, perhaps, sort of, I guess so
    sentence: >-
      <It is possible that> he will come.; <It is possible for> him to come.; He <could>
      come.; He <might> come.; He <may> come.; He <is able to> come.; <Maybe> he will come.
