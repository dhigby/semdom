name: Names of streets
description: >-
  Use this domain for the proper names of highways, roads, streets, and trails in the
  language area. If there are many such names, only include the important names (e.g. King's
  Highway) or commonly used names (e.g. Main Street).
questions:
  - q: What are the names of the streets in the language area?
    words: King's Highway, Highway 66, Main Street, Piccadilly Square, Oregon Trail
