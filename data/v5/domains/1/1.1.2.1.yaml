code: "1.1.2.1"
guid: 18595DF7-1C69-40DB-A7C1-74D490115C0C
name: Blow air
description: Use this domain for words related to causing air to move.
related: ["1.1.3.1"]
questions:
  - q: What words refer to causing air to move?
    words: blow, fan, exhaust, expel, explode
  - q: What words refer to letting air blow through something?
    words: air out, ventilate
  - q: What words refer to putting air into something (such as a tire or balloon)?
    words: blow up, inflate, pump up, pneumatic
  - q: What words refer to keeping air out of something?
    words: seal, airtight
  - q: What words refer to how much air is in something?
    words: air pressure, vacuum
  - q: What words refer to using the wind to winnow grain?
    words: winnow
  - q: What tools and machines are used to create or use the wind?
    words: >-
      fan, air pump, bellows, ventilator, wind tunnel, propeller, air pipe, airshaft, vent,
      chimney, exhaust, funnel, windmill, sail, valve
