code: "1.1.3.6"
guid: 63C69D11-1101-4870-AEB8-43EE364381B0
name: Lightning, thunder
description: Use this domain for words related to lightning and thunder.
louwNidaCodes: 14D Thunder and Lightning
questions:
  - q: What words refer to lightning?
    words: lightning, lightning bolt, thunderbolt, lightning storm
  - q: What does lightning do?
    words: >-
      (lightning) strike, be struck by lightning, flash (of lightning), streak (of
      lightning), light up
  - q: What do people use to protect themselves from lightning?
    words: lightning rod
  - q: What words refer to thunder?
    words: thunder, thunderstorm, thundercloud, thunderhead
  - q: What words describe the sound thunder makes?
    words: peal (of thunder), clap, rumble, boom, crack of lightning, roll
