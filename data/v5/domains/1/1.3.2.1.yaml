code: "1.3.2.1"
guid: 60595D09-4A15-4499-B6E1-D36A704BCBE9
name: Flow
description: >-
  Use this domain for words referring to the way water moves over a surface, such as in a
  river or along the ground.
questions:
  - q: What words refer to water moving over a surface?
    words: >-
      flow, run, stream, current, rise, fall, flood, overflow, to wind, meander, erode,
      split, merge, roil, surge, torrent, trickle, effluence, spread, permeate
  - q: What words refer to water moving in a river?
    words: flow, current, whirlpool
  - q: What words refer to water washing away dirt?
    words: erosion, erode, eroded, wash away, silt, silt up, deposit, settle
  - q: What words refer to water draining out of something?
    words: drain, bleed, discharge, draw off, empty, leak, ooze, strain
