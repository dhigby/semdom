name: Tree
description: >-
  Use this domain for trees--flowering plants with roots, stems, and leaves, which are large
  and have a wooden trunk (Phylum Spermatophyta, Subdivision Angiospermae). Also include the
  evergreen trees (Phylum Spermatophyta, Subdivision Gymnospermae). Evergreen trees do not
  have flowers, but have cone like fruits (pinecones) that contain seeds. Their leaves are
  shaped like needles and are retained for over a year.
ocmCodes: 137d Trees and wood
louwNidaCodes: 3B Trees
