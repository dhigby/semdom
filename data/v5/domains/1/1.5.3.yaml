code: "1.5.3"
guid: C345F278-91FF-463D-B9A6-8ABAC8A267EB
name: Grass, herb, vine
description: >-
  Use this domain for small plants that have roots, stems, flowers, and seeds, but do not
  have a wooden trunk (Phylum Spermatophyta, Subdivision Angiospermae). Also include the
  seedless plants, such as ferns (phylum Pteridophyta, class Filicineae), horsetails (phylum
  Pteridophyta, class Equisetineae), and club mosses (phylum Pteridophyta, class
  Lycopodineae). Plants of the Pteridophyta phylum have no flowers or seeds. Ferns have
  large, divided, feather-like leaves, or fronds. Club mosses are small (rarely over one
  meter) evergreen plants with simple leaves resembling pine or hemlock needles. Sometimes
  they grow upright, but often trail on the ground, where they propagate by means of
  runners. Horsetails send up tall, vertical, jointed stalks with branches covered with
  scale like leaves.
ocmCodes: 137f Grass and Weeds; 137g Herbs, medicinal, fungus
louwNidaCodes: 3C Plants That Are Not Trees
