questions:
  - q: What words refer to all plants?
    words: plant, flora, greenery, vegetation, herbage
  - q: What words describe types of plants?
    words: >-
      angiosperm, annual, aquatic, biennial, bracken, brake, creeper, deciduous, edible,
      flower, greens, herbaceous, hybrid, leafy, legume, luscious, parasite, perennial,
      plankton, pulse, sedge, succulent, tropical, vegetable, vine, weed, woody, wort
  - q: What words are used to describe plants that grow wild?
    words: wild, uncultivated
  - q: What words refer to cultivated plants?
    words: cultivated
  - q: What words refer to a group of plants?
    words: >-
      bale, bouquet, bracken, brush, bunch, canopy, clump, cluster, cover, covert, corsage,
      crop, culture, forest, greenery, grove, growth, hassock, haystack, herbage, jungle,
      kelp, nosegay, orchard, scrub, sheaf, shock, shrubbery, skein, spray, stand, sward,
      thicket, tuft, turf, tussock, underbrush, undergrowth, vegetation, verdure, vermin
  - q: What words refer to the study of plants?
    words: botany, botanist, herbalist
