code: "1.6.1.1.7"
guid: E22D860A-D207-4649-8AB5-4592B838FEBB
name: Sea mammal
description: >-
  Use this domain for mammals that live in the sea--whales and dolphins (phylum Chordata,
  class Mammalia, order Cetacea), seals (phylum Chordata, class Mammalia, order Pinnipedia),
  and sea cows (phylum Chordata, class Mammalia, order Sirenia).
questions:
  - q: What general words refer to sea mammals?
    words: cetacean, pinniped
  - q: What species of whales and dolphins are there?
    words: whale, sperm whale, killer whale, blue whale, right whale, dolphin, porpoise
  - q: What species of seals are there?
    words: seal, walrus, sea lion
  - q: What species of sea cow are there?
    words: sea cow, manatee
