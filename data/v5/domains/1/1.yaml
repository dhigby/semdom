description: >-
  Use this domain for general words referring to the physical universe. Some languages may
  not have a single word for the universe and may have to use a phrase such as 'rain, soil,
  and things of the sky' or 'sky, land, and water' or a descriptive phrase such as
  'everything you can see' or 'everything that exists'.
