code: "2.6.2.2"
guid: 23190F9E-2DB2-4EF9-8C0E-495DBEF05571
name: Attract sexually
description: >-
  Use this domain for words related to attracting someone sexually--to cause someone to want
  to have sex with you, and for words related to being sexually attracted to someone--to
  want to have sex with someone.
questions:
  - q: What words refer to attracting someone sexually?
    words: >-
      attract, be attractive to, appeal to, tempt, seduce, draw, lure, act sexy, excite,
      turn someone on, titillate, flirt, flirtatious
  - q: What words refer to being sexually attracted to someone?
    words: be attracted to, fancy, be interested in, want, lust after, take a fancy to
  - q: What words refer to wanting to have sex?
    words: sex drive, desire, lust (v), want someone, lustful, libido, horny, randy
  - q: What words refer to the feeling of being sexually attracted?
    words: attraction, lust (n), passion
  - q: What words describe someone who is sexually attractive?
    words: >-
      sexy, attractive, desirable, voluptuous, sultry, alluring, luscious, appealing,
      beautiful, allure, sensual, sensuous, good-looking, glamorous, seductive, handsome,
      tempting, irresistible, enticing
  - q: What words describe something someone does to attract someone?
    words: sexy, provocative, seductive, suggestive, sensual, be a turn-on, erotic
  - q: What words refer to a quality a person has that makes them attractive?
    words: >-
      looks, sex appeal, beauty, attraction, appeal, the lure of, charm, attractiveness,
      prettiness, sensuality
  - q: What words describe someone who is not attractive?
    words: unattractive, be a turn-off, sexless
