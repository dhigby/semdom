guid: 3FD34185-19A1-44BD-8555-BC76E2847BEE
name: Instinct
description: >-
  Use this domain for words related to instinct--to know something without being told, to
  know what to do without taught how to do it.
questions:
  - q: What words refer to a natural ability to know what to do?
    words: >-
      instinct, instinctive, intuition, intuitive, sixth sense, gut feeling, just seem to
      know
