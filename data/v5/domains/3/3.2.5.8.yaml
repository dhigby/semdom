code: "3.2.5.8"
guid: 6C6259F0-ECA6-4A30-8662-EEDBAF293527
name: Change your mind
description: >-
  Use this domain for words related to changing your mind--to change what you think about
  something, or change your plans or decisions.
questions:
  - q: What words refer to changing a decision?
    words: change plans, change your mind, rethink, have second thoughts, backtrack, U-turn
  - q: What words describe a person who is willing to change his mind?
    words: open, open-minded
  - q: What words refer to changing your mind many times?
    words: vacillate, go back and forth between, waver
  - q: What words describe a person who keeps changing his mind?
    words: fickle
  - q: What words refer to refusing to change your mind?
    words: stand firm, stand your ground, stick to your guns
  - q: What words describe a person who refuses to change his mind?
    words: >-
      closed, close minded, rigid, inflexible, entrenched, reactionary, diehard,
      intransigent, have fixed ideas, stick in the mud
