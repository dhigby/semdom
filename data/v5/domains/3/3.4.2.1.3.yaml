code: "3.4.2.1.3"
guid: 8D5C28B8-91BE-40B0-B6C2-4D5ADBB495A3
name: Disgusted
description: >-
  Use this domain for words related to feeling disgusted--to dislike something so much that
  you feel sick.
louwNidaCodes: 25Q Abhor
questions:
  - q: What words refer to feeling disgusted by something?
    words: >-
      be disgusted, execrate, feel awful, feel revolted, feel sick, shudder at the thought,
      shudder to think, turn away in disgust, be disgusted, be grossed out, can't stand,
      can't bear
  - q: What words refer to the feeling of disgust?
    words: disgust, abhorrence, detestation, loathing, nausea, revulsion
  - q: What words describe someone who feels disgusted?
    words: disgusted, grossed out, nauseated, revolted, sickened
  - q: What words refer to causing someone to feel disgusted?
    words: disgust, gross out, nauseate, revolt, sicken, turn your stomach
  - q: What words refer to something that causes someone to feel disgusted?
    words: abomination, execration
  - q: What words describe something that causes someone to feel disgusted?
    words: >-
      disgusting, abhorrent, abominable, awful, detestable, foul, gross, loathsome, nasty,
      nauseating, repugnant, repulsive, revolting, sick, sickening
