code: "3.5.1.3"
guid: AC2E424B-6AEE-4031-8864-7B3F4A6FB5A3
name: 'True'
description: >-
  Use this domain for words that indicate if something is true, if it agrees with reality,
  or if it is not true.
louwNidaCodes: 72 True, False; 72A True, False; 72B Accurate, Inaccurate
questions:
  - q: What words indicate that a statement agrees with reality?
    words: true, truth, accurate, in fact, right, correct
  - q: What words indicate that something is not true?
    words: untrue, false, falsehood, wrong, error, inaccurate, incorrect, mistake
