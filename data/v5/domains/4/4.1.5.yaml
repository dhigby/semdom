code: "4.1.5"
guid: 9AC6DEC6-1B8F-463C-8239-E2ACB93586B1
name: Unity
description: >-
  Use this domain for words related to unity--when a group of people agree with each other
  and are not fighting.
louwNidaCodes: 63B Unite
questions:
  - q: What words refer to the unity of a social group?
    words: unity, oneness, integration, unification
  - q: What words refer to unifying a social group or more than one social group?
    words: unite, unify, join, merge, blend, fuse, consolidate
  - q: What words describe a group that is united?
    words: >-
      united, unified, cohesive, joined, combined, connected, undivided, one in spirit, one
      in purpose, single-minded
  - q: What words describe a person, force, or influence that unifies a group?
    words: unifying, uniting
