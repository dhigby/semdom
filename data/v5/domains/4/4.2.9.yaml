name: Holiday
description: Use this domain for words related to a holiday.
questions:
  - q: What words refer to a holiday?
    words: holiday, vacation, trip, honeymoon
  - q: What words refer to going on a holiday?
    words: go on a holiday, take a holiday, go on vacation, take a vacation, go on a trip
  - q: What words refer to a time when you can be away from work or school?
    words: holiday, vacation, break, leave, day off
  - q: What words refer to a person who is on holiday?
