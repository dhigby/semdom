code: "4.3.2.3"
guid: 18B3CA02-18FE-4AB5-8709-C20957A0A2FB
name: Proud
description: >-
  Use this domain for words referring to being proud--to think that something or someone is
  very good and to feel very good about them, especially to think and feel very good about
  yourself--to think that you are better than others, to think that you are better than you
  really are, or to talk and act as if you were better than other people.
louwNidaCodes: 88A' Arrogance, Haughtiness, Pride
related: ["3.5.1.7.3"]
questions:
  - q: What words refer to being proud of something or someone?
    words: >-
      be proud of, be pleased with, be delighted with, be thrilled with, take pride in,
      pride yourself on
  - q: What words refer to being proud of yourself?
    words: >-
      be proud of yourself, be full of yourself, fancy yourself, let something go to your
      head
  - q: What words refer to being satisfied with yourself?
    words: self-satisfied, smug, pleased with yourself, complacent
  - q: What words refer to thinking you are more important than you really are?
    words: >-
      self-important, pompous, jumped up, have delusions of grandeur, get too big for your
      boots/britches
  - q: What words refer to thinking you are better than other people?
    words: snobbish, snobby, haughty, snooty, snotty, superior, stuck-up, class-conscious
  - q: What words describe someone who is proud?
    words: >-
      proud, aloof, arrogant, big-headed, boastful, brash, conceited, contemptuous,
      egocentric, egotistic, egotistical, hoity-toity, imperious, inflated, lofty,
      ostentatious, pretentious, prideful, proud hearted, puffed up, self-aggrandizing,
      self-confident, uppity, vain
  - q: What words refer to behaving in a proud way toward other people?
    words: look down on, look down your nose at, be beneath you, think you're too good for
  - q: What words refer to the quality of being proud?
    words: >-
      pride, sense of achievement, aloofness, arrogance, audacity, conceit, egotism,
      flashiness, haughtiness, hauteur, loftiness, ostentation, pretension, self-importance,
      self-respect, self-will, showiness, snobbery, snobbishness, vanity
  - q: What words refer to a proud person?
    words: snob, prig
  - q: What words refer to something or someone you are proud of?
    words: be someone's pride and joy, be the pride of, be a credit to
  - q: What words refer to something making someone proud?
    words: go to your head
  - q: What words refer to stopping someone from behaving proudly by criticizing them?
    words: >-
      put someone in their place, wipe the smile off someone's face, cut someone down to
      size
