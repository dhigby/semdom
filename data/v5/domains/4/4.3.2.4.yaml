code: "4.3.2.4"
guid: 054E81CE-ABD8-4069-989D-13E2FA58851C
name: Show off
description: >-
  Use this domain for words referring to showing off--to behave in a way that attracts
  people's attention because you want them to admire you.
related: ["3.5.1.7.3"]
questions:
  - q: What words refer to showing off?
    words: show off, flash your money around, put on airs, vaunt yourself
  - q: What words refer to someone who shows off?
    words: show-off, poseur, exhibitionist, flamboyant, dramatic
  - q: What words describe someone who shows off?
    words: showy, ostentatious, ostentatiously, flashy, pretentious, pretentiously, proudly
  - q: What words refer to the quality of showing off?
    words: showiness, flashiness, ostentation
