name: Compete with
description: Use this domain for words related to competing with someone.
questions:
  - q: What words refer to competing with someone?
    words: >-
      compete with, try to beat, gain an advantage over, oppose, engage, fight, struggle,
      vie
  - q: What words refer to a competition?
    words: competition, contest, championship, tournament, conflict, rivalry
  - q: What words refer to a person that you compete against?
