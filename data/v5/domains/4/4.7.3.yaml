questions:
  - q: What words refer to breaking the law?
    words: commit (a crime), break the law
  - q: What words refer to a crime?
    words: >-
      crime, misdemeanor, felony, capital offense, treason, illegality, lawbreaking,
      offense, wrong, wrongdoing, outrage, transgression, trespass, sin, evil
  - q: What words refer to a person who breaks the law?
    words: criminal, lawbreaker, underworld
  - q: What words describe an action that is against the law?
    words: illegal, against the law, criminal, wrong
