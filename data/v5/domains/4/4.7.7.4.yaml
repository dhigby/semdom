name: Execute
description: Use this domain for words related to executing someone for a crime.
louwNidaCodes: 6F Instruments Used in Punishment and Execution
questions:
  - q: What words refer to executing someone for a crime?
    words: execute, behead, hang, crucify, burn at the stake, impale, execution
