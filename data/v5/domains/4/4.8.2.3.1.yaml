name: Ambush
description: >-
  Use this domain for words related to ambushing someone--to attacking someone without
  warning.
louwNidaCodes: 39K Ambush
questions:
  - q: What words refer to ambushing someone?
    words: >-
      ambush, ambuscade, bushwhack, jump, lie in wait for, mug, pounce, strike, turn on,
      waylay
  - q: What words refer to an ambush?
    words: ambush (n), mugging, strike (n), sneak attack, surprise attack
  - q: What words refer to a person who ambushes someone?
    words: ambusher, bushwhacker
