code: "4.9.4.2"
guid: 3EA52505-AA6C-4F28-B475-F15AC1820EC1
name: Demon possession
description: >-
  Use this domain for words referring to demon possession--when a demon or spirit influences
  or controls the behavior of a person. Use this domain for all words related to the
  relationship between spirits and people, including communication between people and
  spirits. Also use this domain for words referring to casting out demons--causing a demon
  to stop influencing or controlling a person.
louwNidaCodes: 53K Exorcism
questions:
  - q: What words refer to being influenced or controlled by a demon?
    words: be possessed, be demonized, go into a trance
  - q: What words refer to what demons do to people?
    words: possess, inhabit, demonize, torture, haunt, trouble
  - q: What words refer to casting out a demon?
    words: >-
      cast out a demon, exorcise, drive out, expel, deliver/free/release from demonic
      power/influence
  - q: What words refer to a person who casts out demons?
    words: exorcist
