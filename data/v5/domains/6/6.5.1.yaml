    words: barn, granary, grain silo, warehouse, storehouse, safe, shed, treasury
  - q: What kinds of buildings are used to sell things?
    words: store, shop, shopping center, mall, kiosk, supermarket
  - q: What kinds of buildings are used by the government?
    words: courthouse, Parliament house, government headquarters, castle, palace
  - q: What kinds of buildings are used by the police?
    words: police station, jail, prison, jailhouse, cell
  - q: What kinds of buildings are used by the military?
