code: "6.5.1"
guid: DC177F3C-D0FD-4232-ADF1-A77B339CDBB2
name: Building
description: >-
  Use this domain for words related to buildings and other large structures that people
  build.
ocmCodes: >-
  340 Structures; 344 Public Structures; 345 Recreational Structures; 346 Religious and
  Educational Structures; 347 Business Structures; 348 Industrial Structures; 349
  Miscellaneous Structures
louwNidaCodes: 7B Buildings; 7D Open Constructions
questions:
  - q: What types of buildings are there?
