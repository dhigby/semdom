      building, structure, construction, kitchen house, bathhouse, outhouse, latrine,
      outbuilding, bank, elevator, gallery, garage, gazebo, hospital, library, lighthouse,
      mausoleum, museum, outbuilding, observatory, pavilion, pyramid, rotunda, skyscraper,
      tabernacle, tower
  - q: What kinds of buildings are used by animals?
    words: barn, shed, hen house, coop, kennel, pound, doghouse, stable
  - q: What kinds of buildings are used for work and to make things?
    words: office, factory, shop, laboratory, plant, greenhouse
