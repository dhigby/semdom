code: "7.3.3.1"
guid: 11CF45EC-F9D6-4C99-8782-738E26A342C8
name: Take something from somewhere
description: Use this domain for words referring to taking something or someone from its place.
questions:
  - q: What words refer to taking something from somewhere?
    words: take, take away, remove, draw off, empty, evacuate, milk, strain
  - q: What words refer to taking something quickly or suddenly?
    words: grab, snatch, whisk away, seize
  - q: What words refer to reaching for something?
    words: reach for, grab at/for, snatch at
  - q: What words refer to causing something to move from somewhere?
    words: displace, dislocate, dislodge
