name: Spread, smear
description: >-
  Use this domain for words related to spreading something--to cover something on all sides
  with something liquid or sticky like paint or mud.
questions:
  - q: What words refer to spreading something on another thing?
    words: >-
      spread, smear, brush, cover, dab, daub, paint, plaster, rub, slather, smear, smudge,
      swab
