code: "7.5.1.1"
guid: 30B3FAA8-747E-465F-833A-A9957A259BE2
name: Separate, scatter
description: >-
  Use this domain for words referring to separating things into groups, and scattering
  things. The basic idea of this domain involves a situation in which two or more things are
  together, and someone moves them so that they are no longer together.
louwNidaCodes: 63G Separate; 15N Disperse, Scatter
questions:
  - q: What words refer to separating or scattering things?
    words: >-
      separate, separation, scatter, disperse, dispersion, dispersal, spread out, spray,
      move apart, move away from each other, put space between, to space (things), space
      out, place at intervals, divide, division, blow apart, distribute, sow, strew, sift
  - q: What words are used of separating people?
    words: separate fighting people, disperse troops
  - q: What words describe the condition of things when they are separated?
    words: separation, dispersion, dispersal, the spread of, division
  - q: What words refer to a group of things that have been separated?
    words: a scattering (of something), Diaspora
  - q: What words describe things that have been scattered?
    words: >-
      be scattered, thrown apart, resettled, thinly spread, spread out, far flung, flung,
      dispersed
  - q: >-
      What words refer to taking something away and putting it aside, separate from the
      others?
    words: >-
      set aside, put aside, separate from the others, keep separate, keep special, reserve,
      pull out
