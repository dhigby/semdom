code: "7.5.2.2"
guid: E43C9905-AE67-4627-8B10-BD7A453828B4
name: Stick together
description: Use this domain for words referring to two or more things cohering or sticking together.
questions:
  - q: What words refer to joining two things together using glue or a sticky substance?
    words: stick, stick down, stick together, glue
  - q: What words refer to two or more things sticking together?
    words: stick, stick together, adhere, cake, cling, cohere, grip, lump
  - q: What words describe something that sticks to other things?
    words: sticky, adhesive, gummy, magnetic, tacky
