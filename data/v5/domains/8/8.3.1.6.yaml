code: "8.3.1.6"
guid: 6C36A680-4FF4-43B9-A7C2-9037CEB0D3F6
name: Round
description: Use this domain for words referring to being round.
questions:
  - q: What words describe something that is round?
    words: round, circular, spherical, globular, ball shaped, ring
  - q: What words refer to something that is round?
    words: circle, loop, ball, globe, sphere, arch
  - q: What words refer to making something round?
    words: round (off), roll into a ball, make a ball of, loop
  - q: What tools are used to draw a circle?
    words: compass
  - q: What words refer to something that is long and round?
    words: cylinder, cylindrical, rod, pipe, tube
