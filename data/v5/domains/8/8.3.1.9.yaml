name: Stretch
description: Use this domain for words referring to stretching something.
questions:
  - q: What words refer to stretching something?
    words: stretch, draw out, enlarge, extend
  - q: What words describe something that can be stretched?
    words: elastic
  - q: What words describe something that cannot be stretched?
    words: inelastic
