name: Improve
description: Use this domain for words related to improving something--to make something better.
related: ["9.1.2.6"]
questions:
  - q: What words refer to improving something?
    words: >-
      improve, improvement, ameliorate, correct, develop, reform, remedy, renovate,
      renovation, upgrade
