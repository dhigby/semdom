name: Month
description: Use this domain for words referring to a month.
questions:
  - q: What words refer to a month?
    words: month, this month, last month, next month, the months to come
  - q: What words are used to indicate that something happens every month?
    words: monthly, every month, each month
  - q: What words refer to a time during the month?
    words: full moon, half moon, new moon
