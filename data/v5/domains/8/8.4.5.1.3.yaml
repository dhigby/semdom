code: "8.4.5.1.3"
guid: A345D090-14E2-4897-9186-DEBCB05AB27C
name: Next
description: Use this domain for words referring to something happening next.
questions:
  - q: What words indicate that an event happens next?
    words: next, right afterwards, the day after, then
  - q: What words describe something that happens next?
    words: next, following, ensuing
  - q: What words refer to an event happening next after another event?
    words: follow, come next, be after, be next, succeed, come after, go after, go next, ensue
