code: "8.4.5.1.5"
guid: 6712385A-6740-4F28-8BBE-8615EA17116B
name: Regular
description: Use this domain for words referring to something that happens regularly.
ocmCodes: 512 Daily Routine
questions:
  - q: What words indicate that something happens regularly?
    words: >-
      regular, regularly, at regular intervals, every day, daily, be punctuated by, with
      great regularity, routine, like clockwork
  - q: What words indicate that something happens sometimes but not regularly?
    words: intermittently, intermittent, on and off, off and on, in fits and starts, sporadic
  - q: What words indicate that something does not happen regularly?
    words: irregular, without warning
