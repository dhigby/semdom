name: End
description: Use this domain for words referring to the end of an action or situation.
louwNidaCodes: '67C A Point of Time with Reference to Duration of Time: Beginning, End'
questions:
  - q: What words refer to the end of something?
    words: >-
      end, finish, conclusion, consummation, culmination, denouement, expiration, finale,
      homestretch, last, outcome, termination, terminus, terminal, conclusion, time is up,
      that is all
