code: "8.4.6.4.1"
guid: D27A5602-ECE1-452E-9ED6-7261082DC8B8
name: Soon
description: Use this domain for words referring to something happening soon.
questions:
  - q: What words indicate that an event will happen soon?
    words: >-
      soon, sooner, almost, approach, close, directly, imminence, imminent, impending, near,
      presently, quickly, shortly, about to, in a little while, not long, won't be long,
      almost here, just around the corner, in the near future, about to happen, any minute
      (now), in a minute, in a moment
