code: "8.4.6.6.5"
guid: 1C8DA3AA-3C74-4188-8949-5AB82FC1F99C
name: Every time
description: >-
  Use this domain for words referring to something happening every time something else
  happens.
questions:
  - q: What words indicate that something always happens?
    words: always, habitually
  - q: What words indicate that when one thing happens something else always happens?
    words: every time, whenever
  - q: What words indicate that something happens every day or week?
    words: every (day)
    sentence: John waters his cows <every> evening.
