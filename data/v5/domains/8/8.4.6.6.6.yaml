code: "8.4.6.6.6"
guid: 4E2ADAED-145E-45FC-8448-81C0BD47C414
name: Never
description: >-
  Use this domain for words that indicate that something that never happens, or that
  something has not once happened.
questions:
  - q: What words indicate that something that never happens?
    words: >-
      never, not ever, never once, not once, never for a moment, not for a moment, never
      ever, at no time, not in a million years, never in a million years, have never been
      known to do something
