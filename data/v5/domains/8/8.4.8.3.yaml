code: "8.4.8.3"
guid: 4C31AC6A-3197-4762-9937-2FDEA90784B7
name: Sudden
description: >-
  Use this domain for words referring to a sudden event--something happens that I don't
  expect.
louwNidaCodes: 68G Rapidity, Suddenness
questions:
  - q: What words refer to moving suddenly?
    words: move suddenly, sudden movement
  - q: What words are used to indicate that an event is sudden?
    words: sudden (warning), all of a sudden, abrupt
  - q: What words are used to indicate that something happened suddenly?
    words: suddenly, abruptly, without warning, without notice
  - q: What words refer to the suddenness of something?
    words: suddenness
