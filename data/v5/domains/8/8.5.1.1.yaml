code: "8.5.1.1"
guid: 70F80041-AF88-4521-9EBD-21D8F0B0D131
name: In front of
description: Use this domain for words referring to being in front of you.
louwNidaCodes: 83F In Front Of, Face To Face, In Back Of, Behind
questions:
  - q: What words indicate that something is in front of something else?
    words: >-
      front, in front, in the front, up front, forward, in the foreground, be in front, out
      in front, before, ahead of
  - q: What words refer to the front of a line of people or vehicles?
    words: the front
  - q: What words refer to being at the front of a line?
    words: at the front, at the head of, leading
  - q: What words indicate that something is in front of you?
    words: in front, ahead, up ahead
  - q: What words indicate that two people are in front of each other?
    words: face to face, facing each other
