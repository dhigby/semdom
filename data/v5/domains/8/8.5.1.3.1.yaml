code: "8.5.1.3.1"
guid: C13CA251-6103-4475-85AF-933311923F2C
name: Above
description: >-
  Use this domain for words that express the idea that something is above another thing. The
  concept 'above' is inherently relational, expressing the relative positions of two things.
louwNidaCodes: 83I Above, Below
questions:
  - q: What words indicate that something is above something else?
    words: above, higher than, over, overhang, up above, super-, supra-, on high
  - q: What words describe something that is above something else?
    words: aloft, overhanging, overhead, upper
