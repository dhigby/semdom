code: "8.5.1.3.2"
guid: 0A1AD4C9-8BF3-448B-A27F-611813B305DE
name: Under, below
description: >-
  Use this domain for words that express the idea that something is under another thing. The
  concept 'under' is inherently relational, expressing the relative positions of two things.
questions:
  - q: What words indicate that something is under something that is directly above it?
    words: under, underneath, beneath, under-, sub-
  - q: What words indicate that something is in a lower position or on a lower level?
    words: below, beneath, sunken, lower
  - q: >-
      What words indicate that something is under a covering (such as clothes, skin, or
      paint)?
    words: under, underneath, beneath
  - q: What words refer to being under something?
    words: underlay, underlie
  - q: What words describe something that is under another thing?
    words: underlying, nether
