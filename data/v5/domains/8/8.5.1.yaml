code: "8.5.1"
guid: F76C3803-1C7A-4181-9A87-64AE7231A67D
name: Here, there
description: Use this domain for words that refer to a place in relation to the speaker or listener.
louwNidaCodes: 83A Here, There
questions:
  - q: What words refer to a place near the speaker?
    words: here, hereabouts, hither, in this place, on this very spot, around here
  - q: What words refer to a place near the listener?
    words: there, thereabouts, thither
  - q: What words refer to a place that is not near the speaker or the listener?
    words: over there, elsewhere, yon, yonder
