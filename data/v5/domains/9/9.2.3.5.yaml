name: Demonstrative pronouns
description: Use this domain for demonstrative pronouns.
louwNidaCodes: 92G Demonstrative or Deictic Reference
questions:
  - q: What pronouns are used to indicate a particular referent?
    words: a, an, the, this, these, that, those, specific
    sentence: >-
      <the> leader; <a> really old man; <this> new shirt; <these> tomatoes; <that> book;
      <those> flowers; I want <this>.; <That> is what I want.
