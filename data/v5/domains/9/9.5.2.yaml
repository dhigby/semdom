code: "9.5.2"
guid: 0EEFA07A-E0A3-49E3-AEB4-62F1EAFD8E23
name: Semantically similar events
description: >-
  Use this section for words that join semantically similar events into one sentence. Each
  sentence is actually reporting two or more situations, which may differ in one or two
  respects. The words to be included in these domains indicate that two situations are being
  reported, or mark the differences between the two situations.
