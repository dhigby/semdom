code: "9.6.2.4"
guid: 779E4547-DEE6-4780-A180-30A740F9574C
name: Basis
description: Use this domain for words indicating that something is the basis for another thing.
louwNidaCodes: 89F Basis
questions:
  - q: What words indicate that one thing is the basis for another?
    words: >-
      basis, foundation, on the basis of, in view of, by virtue of, be the basis of, form
      the basis of, on what basis? What do you base your...?
    sentence: >-
      His promise <is the basis of> my hope.; His work <formed the basis of> all subsequent
      developments.; He was convicted <on the basis of> circumstantial evidence.; <In view
      of> the current situation we should think about moving.; <By virtue of> the authority
      conferred on me I pronounce you man and wife.
